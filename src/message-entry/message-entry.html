<div id="my-toolbar">
  <span class="ql-formats">
    <button class="ql-bold"></button>
    <button class="ql-italic"></button>
    <button class="ql-strike"></button>
    <button class="ql-underline"></button>
    <button class="ql-code"></button>
  </span>
  <span class="ql-formats">
    <select class="ql-size">
      <option value="0.625em">Tiny</option>
      <option value="0.8125em">Small</option>
      <option value="1em" selected>Normal</option>
      <option value="1.125em">Large</option>
      <option value="1.5em">Huge</option>
    </select>
  </span>
  <chat-color-selector [(color)]="color" [darkMode]="darkMode()"></chat-color-selector>
  <div id="kaomoji-panel" [style.top]="kaomojiPosition().top" [style.left]="kaomojiPosition().left"
       [style.display]="showKaomoji() ? 'grid' : 'none'">
    @for (kaomoji of kaomoji; track kaomoji) {
      <div class="kaomoji-item kaomoji" (click)="insertKaomoji(kaomoji)">{{ kaomoji }}</div>
    }
  </div>
  <div id="upload-panel" [style.top]="filePromptPosition().top" [style.left]="filePromptPosition().left"
       [style.display]="showFilePrompt() ? 'flex' : 'none'">
    <label for="file-upload">Choose a file to upload:</label>
    <input type="file" id="file-upload" (change)="onFileSelected($event)">
    <div class="buttons">
      <button (click)="toggleFileUpload()">Cancel</button>
      <button (click)="uploadSelectedFile()" [disabled]="!this.lastSelectedFiles">Upload</button>
    </div>
  </div>
  <div class="inserts">
    <button id="emoji-button" (click)="toggleEmoji()">😀</button>
    <button id="kaomoji-button" class=" kaomoji" (click)="toggleKaomoji()">ヽ(´∇`)ノ</button>
    <emoji-mart emoji="" [style.display]="showEmoji() ? 'block' : 'none'" [darkMode]="darkMode()"
        [style.top]="pickerPosition().top" [style.left]="pickerPosition().left" [totalFrequentLines]="2"
        (emojiClick)="emojiClick($event)"></emoji-mart>
    <button id="upload-button" (click)="toggleFileUpload()"><i class="fa-solid fa-upload"></i></button>
  </div>
</div>
<quill-editor [formats]="formats" [modules]="modules" [sanitize]="true"
              (onEditorCreated)="editorCreated($event)" placeholder="">
</quill-editor>
